name: Build Windows
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Descomprimir proyecto
        shell: pwsh
        run: |
          if (Test-Path KonMusicPC_proyecto.zip) { Expand-Archive -Path KonMusicPC_proyecto.zip -DestinationPath . -Force }
          if (-not (Test-Path KonMusicPC)) { New-Item -ItemType Directory KonMusicPC | Out-Null; Get-ChildItem -Exclude KonMusicPC,.git,.github | Move-Item -Destination KonMusicPC }

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        working-directory: KonMusicPC
        run: pip install -r requirements.txt pyinstaller

      - name: Descargar yt-dlp y ffmpeg
        working-directory: KonMusicPC
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force bin | Out-Null
          Invoke-WebRequest https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe -OutFile bin/yt-dlp.exe
          Invoke-WebRequest https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_tmp -Force
          $b = (Get-ChildItem ffmpeg_tmp -Directory | Select-Object -First 1).FullName
          Copy-Item "$b/bin/ffmpeg.exe" bin/ffmpeg.exe
          Copy-Item "$b/bin/ffprobe.exe" bin/ffprobe.exe

      - name: Crear el programa (.exe)
        working-directory: KonMusicPC
        run: >
          pyinstaller --noconfirm --windowed --name KonMusic --icon assets/icon.ico
          --hidden-import vlc
          --add-data "assets;assets"
          --add-binary "bin/yt-dlp.exe;bin"
          --add-binary "bin/ffmpeg.exe;bin"
          --add-binary "bin/ffprobe.exe;bin"
          main.py

      - name: Incluir el reproductor VLC dentro del programa
        working-directory: KonMusicPC
        shell: pwsh
        run: |
          $ok = $false
          foreach ($v in @("3.0.21", "3.0.20", "3.0.18")) {
            try {
              Invoke-WebRequest "https://get.videolan.org/vlc/$v/win64/vlc-$v-win64.zip" -OutFile vlc.zip -ErrorAction Stop
              Expand-Archive vlc.zip -DestinationPath vlc_tmp -Force
              $ok = $true; break
            } catch { Write-Host "VLC $v no disponible" }
          }
          if ($ok) {
            $src = (Get-ChildItem vlc_tmp -Directory | Select-Object -First 1).FullName
            New-Item -ItemType Directory -Force dist/KonMusic/vlc | Out-Null
            Copy-Item "$src/libvlc.dll", "$src/libvlccore.dll" dist/KonMusic/vlc/
            Copy-Item "$src/plugins" dist/KonMusic/vlc/plugins -Recurse
          } else { Write-Host "No se pudo incluir VLC: el programa pedirá tener VLC instalado." }

      - name: Instalador (opcional)
        working-directory: KonMusicPC
        continue-on-error: true
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss

      - name: Comprimir version portable
        working-directory: KonMusicPC
        shell: pwsh
        run: Compress-Archive -Path dist/KonMusic -DestinationPath KonMusic_PC_portable.zip

      - uses: actions/upload-artifact@v4
        with:
          name: KonMusic-Windows
          path: |
            KonMusicPC/KonMusic_PC_portable.zip
            KonMusicPC/installer_out/*.exe
